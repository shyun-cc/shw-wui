title: shw-wui 设计讨论稿
baseURL: https://shyun-cc.github.io/shw-wui/
defaultContentLanguage: zh
locale: zh-CN
hasCJKLanguage: true
timeZone: UTC
enableRobotsTXT: true
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    title: shw-wui 设计讨论稿
    hasCJKLanguage: true
    params:
      description: 电脑 UI 组件库的设计讨论稿，尚未实现。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML]
params:
  offline_search: true
  copyright:
    authors: shw-wui contributors
    from_year: 2026
  footer_center_info: 设计讨论稿 · 尚未实现
  ui:
    preset: paper
    dark_mode: true
    sidebar_menu_foldable: true
    section_index: cards
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
